[workflow]

# RRS build-cycle rules:
# conditional recon, EditMode/PlayMode routing, verification checkpoint,
# review policy, and tools that must not be integrated.
#
# Loaded at activation and kept for the entire run from this single source
# (docs/setup/build-workflow-rules.md) — the verification checkpoint policy,
# including the command and its mode, lives only there (section 3) to avoid
# a second copy drifting out of sync. Cross-cutting repository rules remain
# in AGENTS.md.

persistent_facts = [
  "file:{project-root}/docs/setup/build-workflow-rules.md",
]

implementation_handoff = """
Launch a subagent with no prior conversation context, with this prompt:

> Read {spec_file} fully and implement it. Load every file listed in its frontmatter `context:` before you start.
>
> Keep scope surgical. Use risk-scaled verification:
>
> - docs, comments, formatting, copy, or tiny local changes: inspect the changed files and run the cheapest relevant check, if any;
> - normal behavior changes: run targeted tests or the nearest existing verification command;
> - shared contracts, migrations, auth, payments, concurrency, build tooling, or broad refactors: run broader checks.
>
> Do not add tests just to satisfy process. Add or update tests only when changed behavior is regression-prone and the project already has a suitable test pattern.
>
> When done, report what changed, what you verified, why that verification was enough, and anything left incomplete or risky.
"""

[[workflow.review_layers]]
id = "blind-hunter"
name = "Risk-Scaled Reviewer"
instruction = """
Review the diff once, proportionally to its blast radius.

Return only real findings caused by this change. Do not force a minimum number of findings.
For trivial or localized changes, an empty list is acceptable.
Prefer at most three findings unless there is clear evidence of serious risk.
Do not request more tests unless an important changed behavior is unverified by the nearest relevant check.

CONTENT:
{diff_output}
"""

# Enabled conditionally: this is not a default review pass.
# The trigger explicitly excludes documentation-only diffs and small local changes.
#
# The asymmetry with verification-gap below is intentional:
# this review can generate substantial output, so uncertainty disables it;
# verification-gap is shorter and protects against missing evidence,
# so uncertainty enables that review instead.

[[workflow.review_layers]]
id = "edge-case-hunter"
name = "Edge Case Hunter"
when = """
The change is non-trivial, meaning it touches at least one of the following:
networking (RPCs, ownership, NetworkVariable write permissions, spawn/despawn),
driving or behavioral AI, physics and collisions, state or lifecycle
(MonoBehaviour, scene, prefab, coroutine, timing/frame),
a contract shared across multiple assemblies or features,
a cross-file refactor, or dense logic with multiple branches.

Do NOT trigger for documentation, comments, formatting, labels,
an isolated tuning value — including changing the value of an existing NetworkVariable
without changing its permissions — or a tiny, local change inside a single already-known file.

If uncertain whether the change is non-trivial, consider this review inactive.
"""
instruction = """
Launch a context-free subagent with this prompt:

Read `{skill-root}/review-prompts/edge-case-hunter.md` completely and follow it as your review instructions.

Review content:

{diff_output}

Do not invoke any skill.
If the instruction file is unreadable, report that exact failure and stop.
Return only the review result.
"""

# Enabled whenever observable behavior changes.
# This is the safety net for behavioral changes, not a compliance pass
# for documentation-only diffs.

[[workflow.review_layers]]
id = "verification-gap"
name = "Verification Gap Reviewer"
when = """
The change modifies observable behavior — logic, data, calculations, validation,
algorithms, ScriptableObjects, contracts, interfaces, or runtime output —
rather than only documentation, comments, formatting, labels,
or a tiny and purely local change.

If uncertain whether the change is behavioral, consider this review active:
a missing test is more costly than one unnecessary review pass.
"""
instruction = """
Launch a context-free subagent with this prompt:

Read `{skill-root}/review-prompts/verification-gap.md` completely and follow it as your review instructions.

Review content:

{diff_output}

Do not invoke any skill.
If the instruction file is unreadable, report that exact failure and stop.
Return only the review result.
"""

# Conditional review layer: never enabled by default.
# AD-10 — security review is justified only when the story creates,
# expands, or moves a network trust boundary, never for a simple replicated value.

[[workflow.review_layers]]
id = "security-review"
name = "Network Trust Boundary Reviewer"
when = """
The diff introduces or moves a network trust boundary, meaning at least one of the following:

- a new RPC is introduced;
- an existing RPC becomes callable by an additional client;
- SenderClientId validation or usage changes;
- ownership or host/client authority changes;
- NetworkVariable write permissions change;
- client-controlled data reaches an authoritative execution path.

Do NOT trigger for tuning changes, changes to replicated values without authority changes,
adding a replicated field without changing permissions, or local/presentation-only work.
"""
instruction = """
Launch a context-free subagent with this prompt:

Review CONTENT strictly against one question:
does the change create or move a network trust boundary that a client can abuse?

CONTENT:
{diff_output}

Focus only on real reachable weaknesses introduced or exposed by this change:

- every RPC a client can call: is the caller's authority established server-side,
  or is the payload trusted? Check that `SenderClientId` /
  `RpcParams.Receive.SenderClientId` is compared against the authoritative owner
  before any state mutation, and that the comparison is the correct one.

- payload sanity: can a client send values that are out of range, negative, null,
  oversized, or a reference to a NetworkObject the sender does not own?

- ownership and authority: can a non-owner drive a server-write path,
  or can a client claim a role it does not hold?

- NetworkVariable write permissions: did any permission widen,
  and does the widened writer have a legitimate reason?

- client-controlled data reaching a host-authoritative path,
  including through a relayed field.

- denial of service: unbounded loops, allocations, or repeated spawning
  driven by client input.

For each finding give:
- the file and line;
- the exact sequence a client would use;
- why the current guard does not stop it;
- the smallest fix.

If the change does not actually move a trust boundary,
return an empty list and say so plainly.
Do not manufacture findings to justify the review pass.

Do not invoke any skill.
Return only the review result.
"""

[[workflow.oneshot_review_layers]]
id = "blind-hunter"
name = "One-Shot Risk-Scaled Reviewer"
instruction = """
Review the changed files once.

Return only real findings caused by this change.
Do not force a minimum number of findings.
For trivial or localized changes, an empty list is acceptable.
Do not request more tests unless an important changed behavior
is unverified by the nearest relevant check.
"""